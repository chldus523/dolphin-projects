<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌고래 - 커뮤니티</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 글쓰기 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 2rem;
            width: 92%;
            max-width: 560px;
            box-shadow: 0 20px 60px rgba(15,23,42,0.2);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .modal-box h3 { font-size: 1.1rem; font-weight: 800; color: #0f172a; }
        .modal-box select, .modal-box input[type="text"], .modal-box textarea {
            width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px;
            padding: 0.6rem 0.9rem; font-size: 0.88rem;
            font-family: 'Pretendard', sans-serif; color: #0f172a;
            outline: none; transition: border-color 0.2s; background: #f8fafc;
        }
        .modal-box select:focus, .modal-box input[type="text"]:focus, .modal-box textarea:focus { border-color: #0ea5e9; }
        .modal-box textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
        .modal-btns { display: flex; gap: 0.7rem; justify-content: flex-end; }
        .btn-cancel { background: none; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 0.5rem 1.2rem; font-size: 0.85rem; font-weight: 600; color: #64748b; cursor: pointer; font-family: 'Pretendard', sans-serif; }
        .btn-submit { background: #0ea5e9; border: none; border-radius: 10px; padding: 0.5rem 1.4rem; font-size: 0.85rem; font-weight: 700; color: #fff; cursor: pointer; font-family: 'Pretendard', sans-serif; transition: background 0.2s; }
        .btn-submit:hover { background: #0284c7; }
        /* 검색바 */
        .search-row { display: flex; gap: 0.6rem; margin-bottom: 1.2rem; }
        .search-row input { flex: 1; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 0.55rem 1rem; font-size: 0.85rem; font-family: 'Pretendard', sans-serif; color: #0f172a; outline: none; transition: border-color 0.2s; }
        .search-row input:focus { border-color: #0ea5e9; }
        .search-row button { background: #0ea5e9; border: none; border-radius: 12px; padding: 0.55rem 1.2rem; color: #fff; font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: 'Pretendard', sans-serif; transition: background 0.2s; }
        .search-row button:hover { background: #0284c7; }
        /* 플로팅 챗봇 위젯 CSS */
        .chat-fab {
            position: fixed; bottom: 28px; right: 28px;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #0369a1, #0ea5e9);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 6px 24px rgba(14,165,233,0.45);
            z-index: 9000; transition: transform 0.2s, box-shadow 0.2s;
            animation: bob 3s ease-in-out infinite;
        }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .chat-fab:hover { transform: scale(1.1); box-shadow: 0 8px 30px rgba(14,165,233,0.55); animation: none; }
        .chat-fab-tooltip {
            position: fixed; bottom: 38px; right: 96px;
            background: #0f172a; color: #fff; font-size: 0.78rem; font-weight: 600;
            padding: 7px 13px; border-radius: 20px; white-space: nowrap;
            z-index: 8999; pointer-events: none; opacity: 1; transition: opacity 0.3s;
            font-family: 'Pretendard', sans-serif;
        }
        .chat-fab-tooltip::after { content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); border: 6px solid transparent; border-left-color: #0f172a; border-right: none; }
        .chat-fab-tooltip.hidden { opacity: 0; }
        .chatbot-widget {
            position: fixed; bottom: 100px; right: 28px; width: 360px; height: 520px;
            background: #f8fafc; border-radius: 20px; box-shadow: 0 20px 60px rgba(15,23,42,0.22);
            display: flex; flex-direction: column; overflow: hidden; z-index: 9001;
            transform: scale(0.85) translateY(20px); transform-origin: bottom right;
            opacity: 0; pointer-events: none;
            transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s ease;
        }
        .chatbot-widget.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
        .widget-header { background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%); padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .widget-avatar { width: 36px; height: 36px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .widget-title h2 { font-size: 0.88rem; font-weight: 800; color: #fff; }
        .widget-title p { font-size: 0.67rem; color: rgba(255,255,255,0.68); margin-top: 1px; }
        .widget-close { margin-left: auto; background: rgba(255,255,255,0.18); border: none; color: #fff; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
        .widget-close:hover { background: rgba(255,255,255,0.3); }
        .widget-chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .widget-chat::-webkit-scrollbar { width: 3px; }
        .widget-chat::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .msg { display: flex; align-items: flex-end; gap: 6px; max-width: 88%; animation: msgIn 0.25s ease forwards; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg.bot { align-self: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-av { width: 26px; height: 26px; background: linear-gradient(135deg, #0ea5e9, #38bdf8); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
        .msg-bubble { padding: 9px 12px; border-radius: 14px; font-size: 0.82rem; line-height: 1.6; word-break: keep-all; }
        .msg.bot .msg-bubble { background: #fff; color: #0f172a; border-bottom-left-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
        .msg.user .msg-bubble { background: #0ea5e9; color: #fff; border-bottom-right-radius: 3px; }
        .typing-wrap { display: flex; align-items: flex-end; gap: 6px; align-self: flex-start; animation: msgIn 0.25s ease forwards; }
        .typing-dots { display: flex; gap: 4px; padding: 10px 13px; background: #fff; border-radius: 14px; border-bottom-left-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
        .typing-dots span { width: 5px; height: 5px; background: #7dd3fc; border-radius: 50%; animation: dot 1.4s ease-in-out infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1.1); opacity: 1; } }
        .widget-chips { padding: 2px 12px 8px; display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
        .p-chip { background: #fff; border: 1.5px solid #bae6fd; color: #0369a1; font-size: 0.68rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; cursor: pointer; font-family: 'Pretendard', sans-serif; transition: all 0.18s; }
        .p-chip:hover { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }
        .widget-input-area { padding: 8px 10px 10px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 7px; align-items: flex-end; flex-shrink: 0; }
        #widgetInput { flex: 1; background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 11px; padding: 8px 11px; font-size: 0.81rem; font-family: 'Pretendard', sans-serif; color: #0f172a; resize: none; outline: none; max-height: 80px; line-height: 1.5; transition: border-color 0.2s, box-shadow 0.2s; }
        #widgetInput:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,0.1); }
        #widgetInput::placeholder { color: #94a3b8; }
        #widgetSend { width: 34px; height: 34px; background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 3px 8px rgba(14,165,233,0.4); transition: all 0.18s; }
        #widgetSend:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14,165,233,0.5); }
        #widgetSend:disabled { opacity: 0.4; cursor: not-allowed; }
        #widgetSend svg { width: 15px; height: 15px; fill: #fff; }
        .fab-badge { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; background: #ef4444; border-radius: 50%; font-size: 0.65rem; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
        @media (max-width: 420px) { .chatbot-widget { right: 12px; bottom: 90px; width: calc(100vw - 24px); height: 70vh; } .chat-fab { bottom: 16px; right: 16px; } }
    </style>
</head>
<body>
    <header>
        <div class="nav-inner">
            <a href="home.html" class="logo">🐬 청년정책 돌고래</a>
            <div class="nav-links">
                <a href="home.html">홈</a>
                <a href="explore.html">정보 탐색</a>
                <a href="community.html" class="active">커뮤니티</a>
                <a href="mypage.html">마이페이지</a>
            </div>
            <div id="nav-right"></div>
        </div>
    </header>
    <main class="container community-grid">
        <aside class="sidebar">
            <button class="btn-write" onclick="openModal()">📝 새로운 글쓰기</button>
            <div class="sidebar-menu-box">
                <div class="menu-title">게시판 카테고리</div>
                <ul class="category-list">
                    <li class="category-item active" onclick="selectCategory('전체', this)"><a href="#">✨ 전체 보기</a></li>
                    <li class="category-item" onclick="selectCategory('고민 게시판', this)"><a href="#">🤫 고민 게시판</a></li>
                    <li class="category-item" onclick="selectCategory('정책 후기', this)"><a href="#">📝 정책 후기</a></li>
                    <li class="category-item" onclick="selectCategory('합격/탈락 사례', this)"><a href="#">✅ 합격/탈락 사례</a></li>
                    <li class="category-item" onclick="selectCategory('정보 교류', this)"><a href="#">💡 정보 교류</a></li>
                </ul>
                <div class="divider"></div>
                <div class="menu-title">개인 보관함</div>
                <ul class="category-list">
                    <li class="category-item" onclick="showScrapped(this)">
                        <a href="#" style="color: var(--scrap-color);">⭐ 내가 스크랩한 글 <span class="post-count" id="scrap-count" style="background:#fef3c7; color:var(--scrap-color);">0</span></a>
                    </li>
                </ul>
            </div>
        </aside>
        <section class="board-main">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="키워드나 정책명을 검색해 보세요 (예: 청년월세 후기, 도약계좌)">
                <button onclick="loadPosts()">검색</button>
            </div>
            <div class="feed-container" id="feed-container">
                <div class="no-posts">불러오는 중...</div>
            </div>
        </section>
    </main>

    <!-- 글쓰기 모달 -->
    <div class="modal-overlay" id="writeModal" onclick="handleModalClick(event)">
        <div class="modal-box">
            <h3>📝 새 글 작성</h3>
            <select id="write-category">
                <option value="고민 게시판">🤫 고민 게시판</option>
                <option value="정책 후기">📝 정책 후기</option>
                <option value="합격/탈락 사례">✅ 합격/탈락 사례</option>
                <option value="정보 교류">💡 정보 교류</option>
            </select>
            <input type="text" id="write-title" placeholder="제목을 입력하세요 (100자 이내)" maxlength="100">
            <textarea id="write-content" placeholder="내용을 입력하세요 (2000자 이내)" maxlength="2000"></textarea>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-submit" onclick="submitPost()">게시하기</button>
            </div>
        </div>
    </div>

    <!-- 플로팅 챗봇 위젯 -->
    <div class="chat-fab-tooltip" id="fabTooltip">AI 챗봇에게 물어보세요 🐬</div>
    <button class="chat-fab" id="chatFab" onclick="toggleWidget()" style="position:fixed;">
        <span id="fabIcon">🐬</span>
        <span class="fab-badge" id="fabBadge" style="display:none;">1</span>
    </button>
    <div class="chatbot-widget" id="chatbotWidget">
        <div class="widget-header">
            <div class="widget-avatar">🐬</div>
            <div class="widget-title">
                <h2>돌고래 AI 챗봇</h2>
                <p>가족돌봄청년 맞춤 복지 안내</p>
            </div>
            <button onclick="resetChat()" style="background:rgba(255,255,255,0.18);border:none;color:#fff;padding:4px 10px;border-radius:8px;font-size:0.7rem;font-weight:600;cursor:pointer;margin-right:6px;">🔄 새 대화</button>
<button class="widget-close" onclick="closeWidget()">✕</button>
        </div>
        <div class="widget-chat" id="widgetChat"></div>
        <div class="widget-chips" id="widgetChips">
            <button class="p-chip" onclick="sendChip(this)">📋 지원 가능한 복지</button>
            <button class="p-chip" onclick="sendChip(this)">🏠 월세 지원</button>
            <button class="p-chip" onclick="sendChip(this)">📝 필요 서류</button>
            <button class="p-chip" onclick="sendChip(this)">💼 취업 지원</button>
        </div>
        <div class="widget-input-area">
            <textarea id="widgetInput" rows="1" placeholder="질문을 입력해 주세요…" oninput="autoResize(this)"></textarea>
            <button id="widgetSend" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>
<script src="chatbot.js"></script>
</body>
</html>
