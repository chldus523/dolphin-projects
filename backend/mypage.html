<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌고래 - 마이페이지</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="median-income.js"></script>
</head>

<body>

    <header>
        <div class="nav-inner">
            <a href="home.html" class="logo">🐬 청년정책 돌고래</a>
            <div class="nav-links">
                <a href="home.html" id="nav-home">홈</a>
                <a href="explore.html" id="nav-explore">정보 탐색</a>
                <a href="community.html" id="nav-community">커뮤니티</a>
                <a href="mypage.html" id="nav-mypage" class="active">마이페이지</a>
            </div>
            <div id="nav-right"></div>
        </div>
    </header>

    <main class="container">
        <aside class="profile-card">
            <div class="avatar-circle">🐬</div>
            <h2 class="profile-name" id="sidebar-name">— 님</h2>
            <p class="profile-status" id="sidebar-status">정보를 저장해 주세요</p>

            <ul class="mypage-menu">
                <li><a href="#info-section" class="active"><i class="fa-solid fa-user-gear"></i> 내 정보 관리</a></li>
                <li><a href="#docs-section"><i class="fa-solid fa-star"></i> 찜한 정책</a></li>
                <li><a href="#scrap-section"><i class="fa-solid fa-bookmark"></i> 스크랩 목록</a></li>
            </ul>
        </aside>

        <div class="content-box">

            <section id="info-section">
                <h2 class="section-title"><i class="fa-solid fa-sliders"></i> 개인 맞춤 정보 설정</h2>
                <p class="section-desc">정보를 수정하면 돌고래가 실시간으로 가장 적합한 정책을 다시 계산해 드립니다.</p>

                <form class="info-form">

                    <!-- 기본 인적 사항 -->
                    <div class="form-section-title">
                        <i class="fa-solid fa-id-card"></i> 기본 인적 사항
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="input-group">
                            <label>나이 (만)</label>
                            <input type="number" id="mp-age" value="25">
                        </div>
                        <div class="input-group">
                            <label>거주 자치구 <span style="font-weight:400;color:#94a3b8;font-size:0.75rem;">(서울시 정책 안내)</span></label>
                            <select id="mp-region">
                                <option value="">선택해주세요</option>
                                <option value="종로구">종로구</option>
                                <option value="중구">중구</option>
                                <option value="용산구">용산구</option>
                                <option value="성동구">성동구</option>
                                <option value="광진구">광진구</option>
                                <option value="동대문구">동대문구</option>
                                <option value="중랑구">중랑구</option>
                                <option value="성북구">성북구</option>
                                <option value="강북구">강북구</option>
                                <option value="도봉구">도봉구</option>
                                <option value="노원구">노원구</option>
                                <option value="은평구">은평구</option>
                                <option value="서대문구">서대문구</option>
                                <option value="마포구">마포구</option>
                                <option value="양천구">양천구</option>
                                <option value="강서구">강서구</option>
                                <option value="구로구">구로구</option>
                                <option value="금천구">금천구</option>
                                <option value="영등포구">영등포구</option>
                                <option value="동작구">동작구</option>
                                <option value="관악구">관악구</option>
                                <option value="서초구">서초구</option>
                                <option value="강남구">강남구</option>
                                <option value="송파구">송파구</option>
                                <option value="강동구">강동구</option>
                            </select>
                        </div>
                    </div>

                    <!-- 경제적 여건 -->
                    <div class="form-section-title" style="margin-top: 1.8rem;">
                        <i class="fa-solid fa-won-sign"></i> 경제적 여건
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="input-group">
                            <label>가구원 수 (본인 포함)</label>
                            <select id="mp-family-size" onchange="updateIncomeHint()">
                                <option value="1">1인</option>
                                <option value="2">2인</option>
                                <option value="3">3인</option>
                                <option value="4">4인</option>
                                <option value="5">5인</option>
                                <option value="6">6인 이상</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>월 소득 (세전, 만원)</label>
                            <input type="number" id="mp-income-man" placeholder="예: 250" min="0" oninput="updateIncomeHint()">
                        </div>
                    </div>
                    <p id="income-hint" style="font-size:0.82rem;color:#64748b;background:#f0f9ff;border:1px solid #e0f2fe;border-radius:10px;padding:0.7rem 1rem;margin-bottom:1.5rem;">
                        가구원 수와 월 소득을 입력하면 기준 중위소득 대비 비율을 자동으로 계산해 드려요.
                    </p>
                    <div class="input-group">
                        <label>취업 상태</label>
                        <select id="mp-employment">
                            <option value="재직자">재직자 (직장인)</option>
                            <option value="구직자">구직자 (취업 준비 중)</option>
                            <option value="프리랜서">프리랜서 / 자영업</option>
                            <option value="학생">학생</option>
                        </select>
                    </div>

                    <!-- 가구·돌봄 현황 -->
                    <div class="form-section-title" style="margin-top: 1.8rem;">
                        <i class="fa-solid fa-house-chimney-user"></i> 가구·돌봄 현황
                    </div>
                    <div class="input-group">
                        <label>가구 형태</label>
                        <select id="mp-household">
                            <option value="1인가구">1인가구 (독립 거주)</option>
                            <option value="부모별거">부모와 별거 (독립 거주)</option>
                            <option value="부모동거">부모와 동거</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>돌봄 대상자 여부 (해당 시 체크)</label>
                        <div class="checkbox-group">
                            <label class="checkbox-card">
                                <span class="checkbox-content">영유아</span>
                                <input type="checkbox" id="care-infant">
                            </label>
                            <label class="checkbox-card">
                                <span class="checkbox-content">노인</span>
                                <input type="checkbox" id="care-elderly">
                            </label>
                            <label class="checkbox-card">
                                <span class="checkbox-content">장애인</span>
                                <input type="checkbox" id="care-disabled">
                            </label>
                        </div>
                    </div>

                    <button type="button" class="btn-save" onclick="saveProfile()">
                        <i class="fa-solid fa-calculator"></i> 정보 저장 및 맞춤 정책 재계산
                    </button>
                </form>
            </section>

            <section id="docs-section" style="margin-top: 5rem;">
                <h2 class="section-title"><i class="fa-solid fa-star"></i> 찜한 정책</h2>
                <p class="section-desc">정보 탐색에서 ⭐ 찜한 정책의 필요 서류가 자동으로 표시됩니다.</p>
                <div id="docs-list" style="display:flex;flex-direction:column;gap:1.2rem;margin-top:1rem;">
                    <p style="color:#94a3b8;font-size:0.88rem;">불러오는 중...</p>
                </div>
            </section>

            <section id="scrap-section" style="margin-top: 5rem;">
                <h2 class="section-title"><i class="fa-solid fa-bookmark"></i> 스크랩 목록</h2>

                <div id="scrap-list" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.8rem;">
                    <p style="color:#94a3b8; font-size:0.88rem;">불러오는 중...</p>
                </div>
            </section>

        </div>
    </main>
    <script>

        // ── XSS 방어: 사용자 입력을 HTML로 해석되지 않게 이스케이프 ──
        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }


        // ── 네비게이션 로그인 표시 ──
        const loggedInUser = localStorage.getItem('userid');
        const navRight = document.getElementById('nav-right');
        if (loggedInUser && navRight) {
            navRight.innerHTML = `
                <span style="margin-right:12px;color:#0f172a;font-size:0.9rem;">👤 <b>${loggedInUser}</b>님</span>
                <button id="btn-logout" style="background:none;border:1px solid #e2e8f0;padding:0.3rem 0.8rem;border-radius:8px;font-weight:600;cursor:pointer;color:#475569;font-size:0.82rem;transition:all 0.2s;font-family:'Pretendard',sans-serif;">로그아웃</button>
            `;
            const lb = document.getElementById('btn-logout');
            lb.addEventListener('mouseenter', () => { lb.style.borderColor='#0ea5e9'; lb.style.color='#0ea5e9'; });
            lb.addEventListener('mouseleave', () => { lb.style.borderColor='#e2e8f0'; lb.style.color='#475569'; });
            lb.addEventListener('click', () => {
                localStorage.removeItem('userid');
                alert('로그아웃 되었습니다.');
                window.location.href = 'index.html';
            });
        }

        // ── 사이드바 프로필 업데이트 ──
        function updateSidebar() {
            const userid = localStorage.getItem('userid') || '—';
            const s = JSON.parse(localStorage.getItem('userProfile') || '{}');
            document.getElementById('sidebar-name').textContent = `${userid} 님`;
            if (s.age && s.region) {
                document.getElementById('sidebar-status').textContent =
                    `${s.region} 거주 · 만 ${s.age}세`;
            }
        }

        // ── 저장된 프로필 불러와서 폼에 반영 ──
        const saved = JSON.parse(localStorage.getItem('userProfile') || '{}');
        if (saved.age)      document.getElementById('mp-age').value         = saved.age;
        if (saved.region)   document.getElementById('mp-region').value      = saved.region;
        if (saved.familySize)   document.getElementById('mp-family-size').value = saved.familySize;
        if (saved.incomeMan)    document.getElementById('mp-income-man').value  = saved.incomeMan;
        if (saved.careInfant)   document.getElementById('care-infant').checked   = saved.careInfant;
        if (saved.careElderly)  document.getElementById('care-elderly').checked  = saved.careElderly;
        if (saved.careDisabled)  document.getElementById('care-disabled').checked  = saved.careDisabled;
        if (saved.employment)    document.getElementById('mp-employment').value    = saved.employment;
        if (saved.household)     document.getElementById('mp-household').value     = saved.household;

        updateSidebar();
        updateIncomeHint();
        loadBookmarkedDocs();
        loadScrappedPosts();

        // 입력값으로 중위소득 % 계산 (없으면 null)
        function currentIncomePct() {
            const size = document.getElementById('mp-family-size').value;
            const man  = document.getElementById('mp-income-man').value;
            if (man === '') return null;
            return calcIncomePercent(Number(man) * 10000, size);   // 만원 → 원
        }

        // 입력할 때마다 계산 결과 안내
        function updateIncomeHint() {
            const hint = document.getElementById('income-hint');
            const pct = currentIncomePct();
            if (pct === null) {
                hint.textContent = '가구원 수와 월 소득을 입력하면 기준 중위소득 대비 비율을 자동으로 계산해 드려요.';
                hint.style.color = '#64748b';
                return;
            }
            const size = document.getElementById('mp-family-size').value;
            const base = Math.round(medianIncomeOf(size) / 10000);
            hint.innerHTML = `📊 <b>${incomePercentLabel(pct)}</b>에 해당해요. ` +
                `<span style="color:#94a3b8;">(${MEDIAN_INCOME_YEAR}년 ${size}인 가구 기준 중위소득 ${base.toLocaleString()}만원)</span>`;
            hint.style.color = '#0369a1';
        }

        // 하위 호환: 기존 코드가 쓰던 income 등급도 함께 저장
        function incomeTierOf(pct) {
            if (pct === null) return '';
            if (pct <= 120) return '1순위';
            if (pct <= 150) return '2순위';
            return '전체';
        }

        function saveProfile() {
            const pct = currentIncomePct();
            const profile = {
                age:          document.getElementById('mp-age').value,
                region:       document.getElementById('mp-region').value,
                familySize:   document.getElementById('mp-family-size').value,
                incomeMan:    document.getElementById('mp-income-man').value,
                incomePct:    pct,                    // 기준 중위소득 대비 %
                income:       incomeTierOf(pct),      // 하위 호환용 등급
                careInfant:   document.getElementById('care-infant').checked,
                careElderly:  document.getElementById('care-elderly').checked,
                careDisabled: document.getElementById('care-disabled').checked,
                employment:   document.getElementById('mp-employment').value,
                household:    document.getElementById('mp-household').value,
            };
            localStorage.setItem('userProfile', JSON.stringify(profile));
            updateSidebar();
            alert('✅ 저장되었습니다! 정보 탐색 페이지와 챗봇에 반영됩니다.');
        }
        async function loadBookmarkedDocs() {
            const bookmarks = JSON.parse(localStorage.getItem('bookmarkedPolicies') || '[]');
            const container = document.getElementById('docs-list');

            if (bookmarks.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8;font-size:0.88rem;">찜한 정책이 없습니다. 정보 탐색에서 ⭐를 눌러 정책을 찜해보세요!</p>';
                return;
            }

            const res = await fetch('/api/policies');
            const allPolicies = await res.json();

            const hasDocs = d => { const t = (d || '').trim(); return t && t !== '-' && t !== '없음'; };
            const isUrl = s => typeof s === 'string' && /^https?:\/\//.test(s);
            const bookmarked = allPolicies.filter(p => bookmarks.includes(p['정책_ID']) && hasDocs(p['제출_서류']));

            if (bookmarked.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8;font-size:0.88rem;">찜한 정책 중 제출 서류 정보가 있는 정책이 없습니다.</p>';
                return;
            }

            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');

            container.innerHTML = bookmarked.map(p => {
                const pid = p['정책_ID'];
                const docs = p['제출_서류'].split(',').map(d => d.trim()).filter(Boolean);
                const done = docs.filter((_, i) => docChecks[`${pid}-${i}`]).length;
                const pct = docs.length ? Math.round((done / docs.length) * 100) : 0;
                const link = isUrl(p['참조_링크']) ? p['참조_링크'] : '#';
                return `
                <div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:1.4rem 1.6rem;">
                    <div style="font-size:0.9rem;font-weight:700;color:#0369a1;margin-bottom:0.6rem;">📌 ${p['정책명']}</div>
                    <div style="margin-bottom:1rem;">
                        <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:#64748b;margin-bottom:4px;">
                            <span>준비 현황</span><span>${done} / ${docs.length}</span>
                        </div>
                        <div style="background:#e2e8f0;border-radius:10px;height:6px;overflow:hidden;">
                            <div id="prog-${pid}" style="height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:10px;width:${pct}%;transition:width 0.4s;"></div>
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:0.7rem;margin-bottom:1.2rem;">
                        ${docs.map((doc, i) => `
                        <div style="display:flex;align-items:center;gap:0.7rem;">
                            <input type="checkbox" id="doc-${pid}-${i}"
                                data-docname="${doc}"
                                ${docChecks[`${pid}-${i}`] ? 'checked' : ''}
                                onchange="saveDocCheck('${pid}', ${i}, ${docs.length}, this)"
                                style="width:16px;height:16px;accent-color:#0ea5e9;flex-shrink:0;cursor:pointer;">
                            <label for="doc-${pid}-${i}" style="font-size:0.85rem;font-weight:600;color:#1e293b;cursor:pointer;${docChecks[`${pid}-${i}`] ? 'text-decoration:line-through;color:#94a3b8;' : ''}">${doc}</label>
                        </div>`).join('')}
                    </div>
                    ${link !== '#' ? `<a href="${link}" target="_blank" class="btn-link">신청 페이지 바로가기 ↗</a>` : ''}
                </div>`;
            }).join('');
        }

        async function loadScrappedPosts() {
            const scrapped = JSON.parse(localStorage.getItem('scrappedPosts') || '[]');
            const list = document.getElementById('scrap-list');

            if (scrapped.length === 0) {
                list.innerHTML = '<p style="color:#94a3b8;font-size:0.88rem;">스크랩한 글이 없습니다.</p>';
                return;
            }

            const res = await fetch('/posts');
            const allPosts = await res.json();
            const scrappedPosts = allPosts.filter(p => scrapped.includes(p.id));

            if (scrappedPosts.length === 0) {
                list.innerHTML = '<p style="color:#94a3b8;font-size:0.88rem;">스크랩한 글이 없습니다.</p>';
                return;
            }

            const CAT_STYLE = {
                '정책 후기':      { color: '#0369a1', bg: '#e0f2fe' },
                '고민 게시판':    { color: '#65a30d', bg: '#f7fee7' },
                '합격/탈락 사례': { color: '#dc2626', bg: '#fef2f2' },
                '정보 교류':      { color: '#ca8a04', bg: '#fef9c3' },
            };

            list.innerHTML = scrappedPosts.map(p => {
                const cs = CAT_STYLE[p.category] || { color: '#475569', bg: '#f1f5f9' };
                const preview = p.content.length > 80 ? p.content.slice(0, 80) + '…' : p.content;
                return `
                <div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:1.2rem 1.4rem;">
                    <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem;">
                        <span style="font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:20px;color:${cs.color};background:${cs.bg};">${escapeHtml(p.category)}</span>
                        <span style="font-size:0.75rem;color:#94a3b8;margin-left:auto;">${escapeHtml(p.userid)}</span>
                    </div>
                    <h4 style="font-size:0.92rem;font-weight:700;color:#0f172a;margin-bottom:0.4rem;">${escapeHtml(p.title)}</h4>
                    <p style="font-size:0.82rem;color:#64748b;line-height:1.6;margin-bottom:0.9rem;">${escapeHtml(preview)}</p>
                    <div style="display:flex;align-items:center;justify-content:space-between;">
                        <a href="community.html?post=${p.id}" style="font-size:0.8rem;font-weight:600;color:#0ea5e9;text-decoration:none;">커뮤니티에서 보기 →</a>
                        <button class="btn-remove" title="스크랩 취소" onclick="removeScrap(${p.id}, this)">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function applyCheck(cb, checked) {
            cb.checked = checked;
            const label = document.querySelector(`label[for="${cb.id}"]`);
            if (label) {
                label.style.textDecoration = checked ? 'line-through' : '';
                label.style.color = checked ? '#94a3b8' : '#1e293b';
            }
        }

        function saveDocCheck(policyId, docIdx, total, cb) {
            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');
            const docName = cb.dataset.docname;
            docChecks[`${policyId}-${docIdx}`] = cb.checked;

            // 같은 서류명을 가진 다른 체크박스도 자동 동기화
            document.querySelectorAll(`input[data-docname="${docName}"]`).forEach(other => {
                if (other === cb) return;
                const [, pid, idx] = other.id.match(/doc-(.+)-(\d+)$/);
                docChecks[`${pid}-${idx}`] = cb.checked;
                applyCheck(other, cb.checked);

                // 해당 정책 진행도 바도 업데이트
                const otherBoxes = document.querySelectorAll(`[id^="doc-${pid}-"]`);
                const otherDone = [...otherBoxes].filter(c => c.checked).length;
                const otherPct = Math.round((otherDone / otherBoxes.length) * 100);
                const otherBar = document.getElementById(`prog-${pid}`);
                if (otherBar) otherBar.style.width = otherPct + '%';
            });

            localStorage.setItem('docChecks', JSON.stringify(docChecks));

            applyCheck(cb, cb.checked);

            // 현재 정책 진행도 바 업데이트
            const checkboxes = document.querySelectorAll(`[id^="doc-${policyId}-"]`);
            const done = [...checkboxes].filter(c => c.checked).length;
            const pct = Math.round((done / total) * 100);
            const bar = document.getElementById(`prog-${policyId}`);
            if (bar) bar.style.width = pct + '%';
        }

        function removeScrap(id, btn) {
            let scrapped = JSON.parse(localStorage.getItem('scrappedPosts') || '[]');
            scrapped = scrapped.filter(s => s !== id);
            localStorage.setItem('scrappedPosts', JSON.stringify(scrapped));
            btn.closest('.scrapped-item').remove();
            document.getElementById('scrap-tab-count').textContent = scrapped.length;
            if (scrapped.length === 0) {
                document.getElementById('scrap-list').innerHTML =
                    '<p style="color:#94a3b8;font-size:0.88rem;">스크랩한 글이 없습니다.</p>';
            }
        }
    </script>
</body>

</html>
