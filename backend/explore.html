<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌고래 - 정보 탐색</title>
    <link rel="stylesheet" href="style.css">
    <script src="policy-match.js"></script>
    <script src="doc-catalog.js"></script>
    <style>
        /* ── 키워드 워드클라우드 필터 ── */
        .filter-wrapper {
            background: #fff;
            border: 1.5px solid #e0f2fe;
            border-top: none;
            border-radius: 0 0 20px 20px;
            padding: 1.3rem 2rem;
            margin-bottom: 2.4rem;
            position: sticky;
            top: var(--header-h, 76px);
            z-index: 500;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.06);
        }
        .filter-wrapper::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            bottom: 100%;
            height: 40px;
            background: var(--bg, #f8fafc);
        }
        .filter-section-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #0369a1;
            letter-spacing: 0.3px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            align-items: center;
        }
        .wc-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.1rem;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s;
            user-select: none;
            line-height: 1.1;
        }
        .wc-tag:hover { border-color: #94a3b8; background: #f1f5f9; color: #0f172a; }
        .wc-tag .wc-count {
            font-size: 0.7rem;
            font-weight: 700;
            color: #94a3b8;
            background: #eef2f7;
            border-radius: 20px;
            padding: 1px 7px;
        }
        .wc-tag.active { color: #fff; border-color: transparent; }
        .wc-tag.active .wc-count { background: rgba(255,255,255,0.25); color: #fff; }
        .result-count { font-size: 0.8rem; color: #64748b; margin-bottom: 0.75rem; }
        .result-count b { color: #0ea5e9; }
        .no-result { text-align: center; padding: 2.5rem 1rem; color: #94a3b8; font-size: 0.9rem; }
        .excluded-section { margin-top: 1.8rem; }
        .excluded-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: #64748b;
            background: #e2e8f0;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 0.7rem 1.1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.18s;
        }
        .excluded-header:hover { background: #cbd5e1; }
        .excluded-header .toggle-icon { margin-left: auto; font-size: 0.7rem; transition: transform 0.2s; }
        .excluded-header.open .toggle-icon { transform: rotate(180deg); }
        .excluded-list { display: none; flex-direction: column; gap: 0.6rem; }
        .excluded-list.open { display: flex; }
        .policy-item.excluded { opacity: 0.65; border-style: dashed; border-color: #cbd5e1; background: #f8fafc; }
        .exclude-reason {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.72rem;
            font-weight: 700;
            color: #ef4444;
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            padding: 0.2rem 0.6rem;
        }
        .policy-benefit { font-size: 0.86rem; color: #334155; line-height: 1.55; margin: 0.4rem 0 0.8rem; }
        /* 즐겨찾기 전 필요 서류 미리보기 */
        .doc-preview { margin: 0.7rem 0 0.2rem; border-top: 1px dashed #e2e8f0; padding-top: 0.7rem; }
        .doc-preview summary {
            list-style: none; cursor: pointer; user-select: none;
            font-size: 0.8rem; font-weight: 700; color: #0369a1;
            display: flex; align-items: center; gap: 0.35rem;
        }
        .doc-preview summary::-webkit-details-marker { display: none; }
        .doc-preview summary::before { content: '▸'; font-size: 0.7rem; transition: transform 0.2s; }
        .doc-preview[open] summary::before { transform: rotate(90deg); }
        .doc-preview ul { list-style: none; margin: 0.6rem 0 0; display: flex; flex-direction: column; gap: 0.35rem; }
        .doc-preview li { font-size: 0.82rem; color: #334155; display: flex; align-items: flex-start; gap: 0.4rem; }
        .doc-preview li::before { content: '📄'; font-size: 0.75rem; }
        .doc-preview li > span { flex: 1; }
        .doc-issue-link {
            font-size: 0.74rem; font-weight: 700; color: #0ea5e9;
            text-decoration: none; white-space: nowrap;
            border: 1px solid #bae6fd; border-radius: 6px; padding: 1px 7px;
            transition: all 0.15s;
        }
        .doc-issue-link:hover { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
        .doc-preview .no-doc { font-size: 0.8rem; color: #94a3b8; margin-top: 0.5rem; }

        /* ── 모바일 반응형 ── */
        @media (max-width: 820px) {
            /* 정책 목록 + 서류 가이드를 1컬럼으로 쌓기 (가이드가 아래로) */
            .explore-layout { grid-template-columns: 1fr !important; }
            /* 사이드바 고정 해제 (좁은 화면에선 본문 아래에 자연스럽게 배치) */
            #guide-sidebar { position: static !important; top: auto !important; }
            /* 고정 필터도 정적으로 (모바일에선 sticky가 화면을 많이 가림) */
            .filter-wrapper { position: static !important; margin-bottom: 1.2rem; }
            .filter-wrapper::before { display: none; }
        }
        /* 워드클라우드: 태그 폭이 제각각이라 안 맞음 → 2열 그리드로 정렬 */
        @media (max-width: 768px) {
            .word-cloud { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
            .wc-tag { width: 100%; justify-content: center; box-sizing: border-box; }
        }
        @media (max-width: 480px) {
            .filter-wrapper { padding: 1.1rem 1.2rem; }
            .word-cloud { gap: 0.5rem; }
            .wc-tag { padding: 0.4rem 0.8rem; font-size: 0.82rem; }
        }
        .btn-doc-link {
            display: inline-block;
            background: #0ea5e9;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.5rem 1.1rem;
            border-radius: 10px;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-doc-link:hover { background: #0284c7; transform: translateY(-1px); }

        /* 플로팅 챗봇 위젯 CSS */
        .chat-fab {
            position: fixed; bottom: 28px; right: 28px;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #0369a1, #0ea5e9);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 6px 24px rgba(14,165,233,0.45);
            z-index: 9000; transition: transform 0.2s, box-shadow 0.2s;
            animation: bob 3s ease-in-out infinite;
        }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .chat-fab:hover { transform: scale(1.1); animation: none; }
        .chat-fab-tooltip {
            position: fixed; bottom: 38px; right: 96px;
            background: #0f172a; color: #fff; font-size: 0.78rem; font-weight: 600;
            padding: 7px 13px; border-radius: 20px; white-space: nowrap;
            z-index: 8999; pointer-events: none; opacity: 1; transition: opacity 0.3s;
        }
        .chat-fab-tooltip::after { content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); border: 6px solid transparent; border-left-color: #0f172a; border-right: none; }
        .chat-fab-tooltip.hidden { opacity: 0; }
        .chatbot-widget {
            position: fixed; bottom: 100px; right: 28px; width: 360px; height: 520px;
            background: #f8fafc; border-radius: 20px; box-shadow: 0 20px 60px rgba(15,23,42,0.22);
            display: flex; flex-direction: column; overflow: hidden; z-index: 9001;
            transform: scale(0.85) translateY(20px); transform-origin: bottom right;
            opacity: 0; pointer-events: none;
            transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s ease;
        }
        .chatbot-widget.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
        .widget-header { background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%); padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .widget-avatar { width: 36px; height: 36px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .widget-title h2 { font-size: 0.88rem; font-weight: 800; color: #fff; }
        .widget-title p { font-size: 0.67rem; color: rgba(255,255,255,0.68); margin-top: 1px; }
        .widget-close { margin-left: auto; background: rgba(255,255,255,0.18); border: none; color: #fff; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
        .widget-close:hover { background: rgba(255,255,255,0.3); }
        .widget-chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .widget-chat::-webkit-scrollbar { width: 3px; }
        .widget-chat::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .msg { display: flex; align-items: flex-end; gap: 6px; max-width: 88%; animation: msgIn 0.25s ease forwards; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg.bot { align-self: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-av { width: 26px; height: 26px; background: linear-gradient(135deg, #0ea5e9, #38bdf8); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
        .msg-bubble { padding: 9px 12px; border-radius: 14px; font-size: 0.82rem; line-height: 1.6; word-break: keep-all; }
        .msg.bot .msg-bubble { background: #fff; color: #0f172a; border-bottom-left-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
        .msg.user .msg-bubble { background: #0ea5e9; color: #fff; border-bottom-right-radius: 3px; }
        .typing-wrap { display: flex; align-items: flex-end; gap: 6px; align-self: flex-start; }
        .typing-dots { display: flex; gap: 4px; padding: 10px 13px; background: #fff; border-radius: 14px; border-bottom-left-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
        .typing-dots span { width: 5px; height: 5px; background: #7dd3fc; border-radius: 50%; animation: dot 1.4s ease-in-out infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1.1); opacity: 1; } }
        .widget-chips { padding: 2px 12px 8px; display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
        .p-chip { background: #fff; border: 1.5px solid #bae6fd; color: #0369a1; font-size: 0.68rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; cursor: pointer; transition: all 0.18s; }
        .p-chip:hover { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }
        .widget-input-area { padding: 8px 10px 10px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 7px; align-items: flex-end; flex-shrink: 0; }
        #widgetInput { flex: 1; background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 11px; padding: 8px 11px; font-size: 0.81rem; color: #0f172a; resize: none; outline: none; max-height: 80px; line-height: 1.5; transition: border-color 0.2s; }
        #widgetInput:focus { border-color: #0ea5e9; }
        #widgetInput::placeholder { color: #94a3b8; }
        #widgetSend { width: 34px; height: 34px; background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 3px 8px rgba(14,165,233,0.4); transition: all 0.18s; }
        #widgetSend:disabled { opacity: 0.4; cursor: not-allowed; }
        #widgetSend svg { width: 15px; height: 15px; fill: #fff; }
        .fab-badge { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; background: #ef4444; border-radius: 50%; font-size: 0.65rem; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
        @media (max-width: 420px) { .chatbot-widget { right: 12px; bottom: 90px; width: calc(100vw - 24px); height: 70vh; } .chat-fab { bottom: 16px; right: 16px; } }
    </style>
</head>
<body>
    <header>
        <div class="nav-inner">
            <a href="home.html" class="logo">🐬 청년정책 돌고래</a>
            <div class="nav-links">
                <a href="home.html" id="nav-home">홈</a>
                <a href="explore.html" id="nav-explore" class="active">정보 탐색</a>
                <a href="community.html" id="nav-community">커뮤니티</a>
                <a href="mypage.html" id="nav-mypage">마이페이지</a>
            </div>
            <span id="nav-right" style="display: flex; align-items: center; font-size: 0.95rem; font-weight: 600;"></span>
        </div>
    </header>
    <main class="container">
        <div class="filter-wrapper">
            <div class="filter-section-title">🏷️ 관심 키워드로 정책 찾기 <span style="font-weight:400;color:#94a3b8;font-size:0.75rem;">(여러 개 선택 가능)</span></div>
            <div class="word-cloud" id="wordCloud"></div>
            <div id="profile-filter-bar" style="margin-top:1.1rem;padding-top:1rem;border-top:1.5px dashed #e0f2fe;"></div>
            <div class="result-count" id="result-count" style="margin:0.9rem 0 0;"></div>
        </div>
        <div class="explore-layout" style="display:grid;grid-template-columns:1fr 380px;gap:1.5rem;align-items:start;">
            <div>
                <div class="policy-list" id="policy-list"></div>
            </div>
            <div id="guide-sidebar" style="position:sticky;top:90px;">
                <div style="background:#fff;border:1.5px solid #e0f2fe;border-radius:20px;padding:1.8rem 2rem;">
                    <div style="font-size:0.95rem;font-weight:800;color:#0369a1;margin-bottom:1rem;display:flex;align-items:center;gap:0.4rem;">
                        📋 서류 준비 가이드
                    </div>
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
                        <button onclick="guideNav(-1)" style="background:#f1f5f9;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;">‹</button>
                        <span id="guide-title" style="font-size:1.05rem;font-weight:800;color:#0f172a;text-align:center;flex:1;margin:0 0.5rem;"></span>
                        <button onclick="guideNav(1)" style="background:#f1f5f9;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;">›</button>
                    </div>
                    <div id="guide-dots" style="display:flex;justify-content:center;gap:5px;margin-bottom:1rem;"></div>
                    <div style="margin-bottom:1rem;">
                        <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:#64748b;margin-bottom:4px;">
                            <span>준비 현황</span><span id="guide-prog-label">0 / 0</span>
                        </div>
                        <div style="background:#e2e8f0;border-radius:10px;height:6px;overflow:hidden;">
                            <div id="guide-prog-bar" style="height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:10px;width:0%;transition:width 0.4s;"></div>
                        </div>
                    </div>
                    <div id="guide-checklist" style="display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.2rem;min-height:120px;"></div>
                    <a id="guide-apply-link" href="#" target="_blank" class="btn-doc-link" style="display:block;text-align:center;">신청 페이지 바로가기 ↗</a>
                </div>
            </div>
        </div>
    </main>

    <!-- 플로팅 챗봇 위젯 -->
    <div class="chat-fab-tooltip" id="fabTooltip">AI 챗봇에게 물어보세요 🐬</div>
    <button class="chat-fab" id="chatFab" onclick="toggleWidget()" style="position:fixed;">
        <span id="fabIcon">🐬</span>
        <span class="fab-badge" id="fabBadge" style="display:none;">1</span>
    </button>
    <div class="chatbot-widget" id="chatbotWidget">
        <div class="widget-header">
            <div class="widget-avatar">🐬</div>
            <div class="widget-title">
                <h2>돌고래 AI 챗봇</h2>
                <p>가족돌봄청년 맞춤 복지 안내</p>
            </div>
            <button onclick="resetChat()" style="background:rgba(255,255,255,0.18);border:none;color:#fff;padding:4px 10px;border-radius:8px;font-size:0.7rem;font-weight:600;cursor:pointer;margin-right:6px;">🔄 새 대화</button>
            <button class="widget-close" onclick="closeWidget()">✕</button>
        </div>
        <div class="widget-chat" id="widgetChat"></div>
        <div class="widget-chips" id="widgetChips">
            <button class="p-chip" onclick="sendChip(this)">📋 지원 가능한 복지</button>
            <button class="p-chip" onclick="sendChip(this)">🏠 월세 지원</button>
            <button class="p-chip" onclick="sendChip(this)">📝 필요 서류</button>
            <button class="p-chip" onclick="sendChip(this)">💼 취업 지원</button>
        </div>
        <div class="widget-input-area">
            <textarea id="widgetInput" rows="1" placeholder="질문을 입력해 주세요…" oninput="autoResize(this)"></textarea>
            <button id="widgetSend" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // ══════════════════════════════════════
        //  네비게이션 / 로그인 상태
        // ══════════════════════════════════════
        function clearUserData() {
            localStorage.clear();
            sessionStorage.clear();
        }
        async function doLogout() {
            try { await fetch('/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
            clearUserData();
            window.location.href = 'index.html';
        }

        const loggedInUser = localStorage.getItem('userid');
        const navRight = document.getElementById('nav-right');
        if (loggedInUser && navRight) {
            navRight.innerHTML = `
                <span style="margin-right:12px;color:#0f172a;font-size:0.9rem;">👤 <b>${loggedInUser}</b>님</span>
                <button id="btn-logout" style="background:none;border:1px solid #e2e8f0;padding:0.3rem 0.8rem;border-radius:8px;font-weight:600;cursor:pointer;color:#475569;font-size:0.82rem;transition:all 0.2s;font-family:'Pretendard',sans-serif;">로그아웃</button>`;
            document.getElementById('btn-logout').addEventListener('click', doLogout);
        } else if (navRight) {
            navRight.innerHTML = `<a href="index.html">로그인</a>`;
        }

        const CAT_GROUPS = [
            { key: '주거',      emoji: '🏠', color: '#2563eb', bg: '#dbeafe', members: ['주거', '생계/주거'] },
            { key: '금융·자산', emoji: '💰', color: '#15803d', bg: '#dcfce7', members: ['금융', '금융/자산', '현금지원/자기돌봄'] },
            { key: '돌봄',      emoji: '🤝', color: '#6d28d9', bg: '#ede9fe', members: ['돌봄', '돌봄/상담'] },
            { key: '교육·취업', emoji: '📚', color: '#c2410c', bg: '#ffedd5', members: ['교육/역량', '취업/진로'] },
            { key: '건강·심리', emoji: '💚', color: '#0e7490', bg: '#cffafe', members: ['의료/건강', '심리/상담', '건강/스포츠'] },
            { key: '생활·기타', emoji: '🎁', color: '#a16207', bg: '#fef9c3', members: ['생활', '기타지원', '종합지원', '문화/행사', ''] },
        ];
        const CAT_TO_GROUP = {};
        CAT_GROUPS.forEach(g => g.members.forEach(m => { CAT_TO_GROUP[m] = g.key; }));
        function groupOf(cat) { return CAT_TO_GROUP[cat] ?? '생활·기타'; }
        function groupMeta(key) { return CAT_GROUPS.find(g => g.key === key); }

        let allPolicies = [];
        let activeGroups = new Set();
        let bookmarks = JSON.parse(localStorage.getItem('bookmarkedPolicies') || '[]');

        async function loadPolicies() {
            const res = await fetch('/api/policies');
            allPolicies = await res.json();
            renderWordCloud();
            renderProfileFilter();
            renderPolicies();
            return allPolicies;
        }

        function renderWordCloud() {
            const counts = {};
            CAT_GROUPS.forEach(g => counts[g.key] = 0);
            allPolicies.forEach(p => { counts[groupOf(p['카테고리'])]++; });
            const cloud = document.getElementById('wordCloud');
            let html = `<span class="wc-tag ${activeGroups.size === 0 ? 'active' : ''}" data-group="__all__" style="font-size:0.95rem;${activeGroups.size === 0 ? 'background:#0ea5e9;' :''}">전체 <span class="wc-count">${allPolicies.length}</span></span>`;
            CAT_GROUPS.forEach(g => {
                const c = counts[g.key];
                const on = activeGroups.has(g.key);
                html += `<span class="wc-tag ${on ? 'active' : ''}" data-group="${g.key}" style="font-size:0.95rem;${on ? `background:${g.color};` : ''}">${g.emoji} ${g.key} <span class="wc-count">${c}</span></span>`;
            });
            cloud.innerHTML = html;
            cloud.querySelectorAll('.wc-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const g = tag.dataset.group;
                    if (g === '__all__') { activeGroups.clear(); }
                    else { activeGroups.has(g) ? activeGroups.delete(g) : activeGroups.add(g); }
                    renderWordCloud();
                    renderPolicies();
                });
            });
        }

        function isUrl(s) { return typeof s === 'string' && /^https?:\/\//.test(s); }
        const SITE_URL = {
            '서울복지포털': 'https://wis.seoul.go.kr/',
            '서울주거포털': 'https://housing.seoul.go.kr/',
            '서울특별시':   'https://www.seoul.go.kr/',
            '서울특볏시':   'https://www.seoul.go.kr/',
            '교육부':       'https://www.moe.go.kr/',
            '복지로':       'https://www.bokjiro.go.kr/',
            '정부24':       'https://www.gov.kr/',
            '에너지바우처': 'https://www.energyv.or.kr/',
        };
        function resolveLink(raw) {
            const s = (raw || '').trim();
            if (!s) return null;
            if (isUrl(s)) return s;
            return SITE_URL[s.replace(/\s/g, '')] || null;
        }

        const userProfile = JSON.parse(localStorage.getItem('userProfile') || '{}');
        let onlyMine = localStorage.getItem('exploreOnlyMine') === 'true';
        function hasProfile() { return !!(userProfile.age && userProfile.income); }
        const INCOME_FLOOR = { '1순위': 0, '2순위': 120, '전체': 150 };
        function userIncomePct() {
            if (Number.isFinite(userProfile.incomePct)) return userProfile.incomePct;
            const floor = INCOME_FLOOR[userProfile.income];
            return floor === undefined ? null : floor;
        }
        function policyIncomeCeil(text) {
            const s = (text || '').replace(/\s/g, '');
            if (!s || s === '-' || s.includes('제한없음')) return null;
            const m = s.match(/중위소득(\d+)%/);
            return m ? parseInt(m[1], 10) : null;
        }
        function excludeReason(p) {
            const lo = p['최소_연령'], hi = p['최대_연령'];
            const age = parseInt(userProfile.age, 10);
            if (Number.isFinite(age) && typeof lo === 'number' && typeof hi === 'number') {
                if (age < lo || age > hi) {
                    const range = hi >= 999 ? `${lo}세 이상` : `${lo}~${hi}세`;
                    return `연령 조건 (${range})`;
                }
            }
            const ceil = policyIncomeCeil(p['소득_기준']);
            const myPct = userIncomePct();
            if (ceil !== null && myPct !== null && myPct > ceil) {
                return `소득 조건 (중위소득 ${ceil}% 이하)`;
            }
            // 3) 거주 자치구 — 특정 구 전용 정책은 그 구 주민만
            if (!matchesDistrict(p, userProfile.region)) {
                return `지역 조건 (${policyDistrict(p)} 거주자 대상)`;
            }
            return null;
        }

        function renderProfileFilter() {
            const bar = document.getElementById('profile-filter-bar');
            if (!hasProfile()) {
                bar.innerHTML = `<div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;font-size:0.82rem;color:#64748b;"><span>🎯 <b style="color:#0369a1;">내 조건 맞춤 필터</b></span><span>마이페이지에서 나이·소득을 입력하면 나에게 맞는 정책만 볼 수 있어요.</span><a href="mypage.html" style="color:#0ea5e9;font-weight:700;text-decoration:underline;">정보 입력하러 가기 →</a></div>`;
                return;
            }
            const INCOME_LABEL = { '1순위': '중위소득 120% 이하', '2순위': '중위소득 120~150%', '전체': '중위소득 150% 초과' };
            const incomeText = Number.isFinite(userProfile.incomePct) ? `중위소득 ${userProfile.incomePct}%` : (INCOME_LABEL[userProfile.income] || userProfile.income);
            bar.innerHTML = `<div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;"><label style="display:flex;align-items:center;gap:0.45rem;cursor:pointer;font-size:0.85rem;font-weight:700;color:#0369a1;"><input type="checkbox" id="chk-only-mine" ${onlyMine ? 'checked' : ''} style="width:16px;height:16px;accent-color:#0ea5e9;cursor:pointer;">🎯 내 조건에 맞는 정책만 보기</label><span style="font-size:0.78rem;color:#64748b;background:#f1f5f9;border-radius:20px;padding:3px 12px;">만 ${userProfile.age}세 · ${incomeText}</span><a href="mypage.html" style="font-size:0.78rem;color:#94a3b8;text-decoration:underline;">조건 수정</a></div>`;
            document.getElementById('chk-only-mine').addEventListener('change', e => {
                onlyMine = e.target.checked;
                localStorage.setItem('exploreOnlyMine', onlyMine);
                renderPolicies();
            });
        }

        function ageText(p) {
            const lo = p['최소_연령'], hi = p['최대_연령'];
            if (lo === '-' || lo === undefined || lo === null) return '연령 무관';
            if (hi >= 999) return `만 ${lo}세 이상`;
            return `만 ${lo}~${hi}세`;
        }

        function renderPolicies() {
            const byCategory = allPolicies.filter(p => activeGroups.size === 0 || activeGroups.has(groupOf(p['카테고리'])));
            const useProfile = onlyMine && hasProfile();
            const filtered = [], excluded = [];
            byCategory.forEach(p => { (useProfile && excludeReason(p) ? excluded : filtered).push(p); });
            document.getElementById('result-count').innerHTML = useProfile
                ? `내 조건에 맞는 정책 <b>${filtered.length}</b>건` + (excluded.length > 0 ? ` · 조건 미달 <b style="color:#ef4444;">${excluded.length}</b>건` : '')
                : `총 <b>${filtered.length}</b>건의 정책`;
            const matchedHtml = filtered.length > 0 ? filtered.map(p => policyCard(p)).join('') : (useProfile ? '<div class="no-result">😥 내 조건에 맞는 정책이 없습니다.</div>' : '<div class="no-result">😥 선택한 키워드에 맞는 정책이 없습니다.</div>');
            const excludedHtml = (useProfile && excluded.length > 0) ? `<div class="excluded-section"><div class="excluded-header" onclick="toggleExcluded(this)"><span class="excluded-label">⚠️ 내 조건에 맞지 않는 정책 ${excluded.length}건 (펼쳐보기)</span><span class="toggle-icon">▼</span></div><div class="excluded-list">${excluded.map(p => policyCard(p, excludeReason(p))).join('')}</div></div>` : '';
            document.getElementById('policy-list').innerHTML = matchedHtml + excludedHtml;
        }

        function policyCard(p, reason = null) {
            const g = groupMeta(groupOf(p['카테고리']));
            const id = p['정책_ID'];
            const isBm = bookmarks.includes(id);
            const benefit = (p['지원_금액(혜택)'] || '').replace(/\s+/g, ' ').trim();
            const url = resolveLink(p['참조_링크']);
            const linkHtml = url ? `<span>🔗 <a href="${url}" target="_blank" style="color:#0ea5e9;text-decoration:underline;">신청/안내 페이지로 바로가기</a></span>` : `<span>🔗 기관 문의</span>`;
            const rightSlot = reason
                ? `<span class="exclude-reason" style="margin-left:auto;">❌ ${reason}</span>`
                : `<button onclick="toggleBookmark('${id}', this)" data-id="${id}" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:1.15rem;line-height:1;padding:0 0.2rem;" title="${isBm ? '찜 취소' : '찜하기'}">${isBm ? '⭐' : '☆'}</button>`;
            const docList = hasDocs(p['제출_서류']) ? p['제출_서류'].split(',').map(d => d.trim()).filter(Boolean) : [];
            const docPreview = `<details class="doc-preview"><summary>📋 필요 서류 미리보기${docList.length ? ` (${docList.length}건)` : ''}</summary>${
                docList.length
                    ? `<ul>${docList.map(d => {
                        const iss = docIssue(d);
                        const issueLink = iss
                            ? ` <a href="${iss.url}" target="_blank" class="doc-issue-link">${iss.issuer}에서 발급 ↗</a>`
                            : '';
                        return `<li><span>${d}</span>${issueLink}</li>`;
                      }).join('')}</ul>`
                    : `<p class="no-doc">이 정책은 제출 서류 정보가 따로 안내되어 있지 않아요. 신청 페이지에서 확인해 주세요.</p>`
            }</details>`;
            return `<div class="policy-item ${reason ? 'excluded' : ''}"><div class="policy-top"><span class="policy-tag" style="color:${g.color};background:${g.bg};">${g.emoji} ${p['카테고리']}</span><span class="d-day-badge" style="color:#16a34a;background:#dcfce7;border-color:#86efac;">${p['신청_기간'] || '상시'}</span>${rightSlot}</div><h3>${p['정책명']}</h3><p class="policy-benefit">💰 ${benefit}</p><div class="policy-meta"><span>👤 ${ageText(p)}</span><span>📊 ${p['소득_기준'] || '제한 없음'}</span>${linkHtml}</div>${docPreview}</div>`;
        }

        function toggleExcluded(header) {
            header.classList.toggle('open');
            const listEl = header.nextElementSibling;
            listEl.classList.toggle('open');
            const isOpen = listEl.classList.contains('open');
            header.querySelector('.excluded-label').textContent = `⚠️ 내 조건에 맞지 않는 정책 ${listEl.children.length}건 (${isOpen ? '접기' : '펼쳐보기'})`;
        }

        function toggleBookmark(id, btn) {
            const idx = bookmarks.indexOf(id);
            if (idx === -1) { bookmarks.push(id); btn.textContent = '⭐'; btn.title = '찜 취소'; }
            else { bookmarks.splice(idx, 1); btn.textContent = '☆'; btn.title = '찜하기'; }
            localStorage.setItem('bookmarkedPolicies', JSON.stringify(bookmarks));
            buildGuideData();
        }

        let GUIDE_DATA = [], guideIdx = 0;
        function hasDocs(docStr) { const d = (docStr || '').trim(); return d && d !== '-' && d !== '없음'; }
        function buildGuideData() {
            GUIDE_DATA = allPolicies.filter(p => bookmarks.includes(p['정책_ID'])).map(p => {
                const g = groupMeta(groupOf(p['카테고리']));
                return { title: `${g.emoji} ${p['정책명']}`, policyId: p['정책_ID'], applyUrl: resolveLink(p['참조_링크']) || '#', docs: hasDocs(p['제출_서류']) ? p['제출_서류'].split(',').map(d => d.trim()).filter(Boolean) : [] };
            });
            guideIdx = 0;
            renderGuide();
        }

        function renderGuide() {
            const $ = id => document.getElementById(id);
            if (GUIDE_DATA.length === 0) {
                $('guide-title').textContent = ''; $('guide-dots').innerHTML = ''; $('guide-prog-label').textContent = ''; $('guide-prog-bar').style.width = '0%'; $('guide-apply-link').style.display = 'none';
                $('guide-checklist').innerHTML = '<p style="color:#94a3b8;font-size:0.85rem;text-align:center;padding:1rem 0;">⭐ 정책을 찜하면<br>서류 준비 가이드가 표시됩니다.</p>';
                return;
            }
            $('guide-apply-link').style.display = 'block';
            const g = GUIDE_DATA[guideIdx];
            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');
            $('guide-title').textContent = g.title;
            $('guide-apply-link').href = g.applyUrl;
            if (g.applyUrl === '#') $('guide-apply-link').removeAttribute('href');
            $('guide-dots').innerHTML = GUIDE_DATA.map((_, i) => `<span style="width:7px;height:7px;border-radius:50%;background:${i === guideIdx ? '#0ea5e9' : '#e2e8f0'};display:inline-block;"></span>`).join('');
            if (g.docs.length === 0) {
                $('guide-prog-label').textContent = '-'; $('guide-prog-bar').style.width = '0%';
                $('guide-checklist').innerHTML = '<p style="color:#94a3b8;font-size:0.85rem;text-align:center;padding:1rem 0;line-height:1.6;">이 정책은 제출 서류 정보가<br>따로 안내되어 있지 않아요.</p>';
                return;
            }
            $('guide-checklist').innerHTML = g.docs.map((doc, i) => {
                const checked = !!docChecks[`${g.policyId}-${i}`];
                const iss = docIssue(doc);
                const issueLink = iss ? `<a href="${iss.url}" target="_blank" class="doc-issue-link" style="margin-left:auto;">${iss.issuer} ↗</a>` : '';
                return `<div style="display:flex;align-items:flex-start;gap:0.6rem;"><input type="checkbox" id="sg-${g.policyId}-${i}" data-docname="${doc}" ${checked ? 'checked' : ''} onchange="guideCheck('${g.policyId}', ${i}, this)" style="width:15px;height:15px;accent-color:#0ea5e9;flex-shrink:0;margin-top:2px;cursor:pointer;"><label for="sg-${g.policyId}-${i}" style="font-size:0.9rem;font-weight:600;color:${checked ? '#94a3b8' : '#1e293b'};cursor:pointer;${checked ? 'text-decoration:line-through;' : ''}">${doc}</label>${issueLink}</div>`;
            }).join('');
            updateGuideProgress(g);
        }

        function updateGuideProgress(g) {
            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');
            const done = g.docs.filter((_, i) => docChecks[`${g.policyId}-${i}`]).length;
            const pct = g.docs.length ? Math.round((done / g.docs.length) * 100) : 0;
            document.getElementById('guide-prog-label').textContent = `${done} / ${g.docs.length}`;
            document.getElementById('guide-prog-bar').style.width = pct + '%';
        }

        function guideNav(dir) { if (GUIDE_DATA.length === 0) return; guideIdx = (guideIdx + dir + GUIDE_DATA.length) % GUIDE_DATA.length; renderGuide(); }

        function guideCheck(policyId, docIdx, cb) {
            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');
            docChecks[`${policyId}-${docIdx}`] = cb.checked;
            const docName = cb.dataset.docname;
            GUIDE_DATA.forEach(g => { g.docs.forEach((doc, i) => { if (doc === docName && !(g.policyId === policyId && i === docIdx)) { docChecks[`${g.policyId}-${i}`] = cb.checked; } }); });
            localStorage.setItem('docChecks', JSON.stringify(docChecks));
            const label = document.querySelector(`label[for="sg-${policyId}-${docIdx}"]`);
            if (label) { label.style.textDecoration = cb.checked ? 'line-through' : ''; label.style.color = cb.checked ? '#94a3b8' : '#1e293b'; }
            updateGuideProgress(GUIDE_DATA[guideIdx]);
        }

        function syncSidebarTop() {
            const header = document.querySelector('header');
            const filter = document.querySelector('.filter-wrapper');
            const sidebar = document.getElementById('guide-sidebar');
            if (!header || !filter || !sidebar) return;
            const headerH = header.offsetHeight;
            document.documentElement.style.setProperty('--header-h', headerH + 'px');
            const cont = document.querySelector('main.container');
            const padTop = parseFloat(getComputedStyle(cont).paddingTop) || 0;
            filter.style.marginTop = Math.max(0, headerH - padTop) + 'px';
            sidebar.style.top = (headerH + filter.offsetHeight + 24) + 'px';
        }

        window.addEventListener('load', () => { loadPolicies().then(() => { buildGuideData(); syncSidebarTop(); }); });
        window.addEventListener('resize', syncSidebarTop);
    </script>
<script src="chatbot.js"></script>
</body>
