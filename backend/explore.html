<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌고래 - 정보 탐색</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── 키워드 워드클라우드 필터 ── */
        .filter-wrapper {
            background: #fff;
            border: 1.5px solid #e0f2fe;
            border-radius: 20px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.5rem;
        }
        .filter-section-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #0369a1;
            letter-spacing: 0.3px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        /* 워드클라우드 태그 영역 */
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            align-items: center;
        }
        .wc-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.1rem;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s;
            user-select: none;
            line-height: 1.1;
        }
        .wc-tag:hover { border-color: #94a3b8; background: #f1f5f9; color: #0f172a; }
        .wc-tag .wc-count {
            font-size: 0.7rem;
            font-weight: 700;
            color: #94a3b8;
            background: #eef2f7;
            border-radius: 20px;
            padding: 1px 7px;
        }
        .wc-tag.active { color: #fff; border-color: transparent; }
        .wc-tag.active .wc-count { background: rgba(255,255,255,0.25); color: #fff; }

        /* ── 정책 결과 ── */
        .result-count {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 0.75rem;
        }
        .result-count b { color: #0ea5e9; }
        .no-result {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .policy-benefit {
            font-size: 0.86rem;
            color: #334155;
            line-height: 1.55;
            margin: 0.4rem 0 0.8rem;
        }

        /* 오른쪽 가이드 서류 링크 버튼 */
        .btn-doc-link {
            display: inline-block;
            background: #0ea5e9;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.5rem 1.1rem;
            border-radius: 10px;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-doc-link:hover { background: #0284c7; transform: translateY(-1px); }
    </style>
</head>
<body>

    <header>
        <div class="nav-inner">
            <a href="home.html" class="logo">🐬 청년정책 돌고래</a>
            <div class="nav-links">
                <a href="home.html" id="nav-home">홈</a>
                <a href="explore.html" id="nav-explore" class="active">정보 탐색</a>
                <a href="community.html" id="nav-community">커뮤니티</a>
                <a href="mypage.html" id="nav-mypage">마이페이지</a>
            </div>
            <span id="nav-right" style="display: flex; align-items: center; font-size: 0.95rem; font-weight: 600;"></span>
        </div>
    </header>

    <main class="container">

        <!-- ── 키워드 워드클라우드 필터 ── -->
        <div class="filter-wrapper">
            <div class="filter-section-title">🏷️ 관심 키워드로 정책 찾기 <span style="font-weight:400;color:#94a3b8;font-size:0.75rem;">(여러 개 선택 가능)</span></div>
            <div class="word-cloud" id="wordCloud"></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 380px;gap:1.5rem;align-items:start;">

            <!-- 왼쪽: 정책 결과 -->
            <div>
                <div class="section-title">
                    <span>서울시 청년·가족돌봄 정책</span>
                </div>
                <div class="result-count" id="result-count"></div>
                <div class="policy-list" id="policy-list"></div>
            </div>

            <!-- 오른쪽: 서류 준비 가이드 사이드바 -->
            <div style="position:sticky;top:90px;">
                <div style="background:#fff;border:1.5px solid #e0f2fe;border-radius:20px;padding:1.8rem 2rem;">

                    <div style="font-size:0.95rem;font-weight:800;color:#0369a1;margin-bottom:1rem;display:flex;align-items:center;gap:0.4rem;">
                        📋 서류 준비 가이드
                    </div>

                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
                        <button onclick="guideNav(-1)" style="background:#f1f5f9;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;">‹</button>
                        <span id="guide-title" style="font-size:1.05rem;font-weight:800;color:#0f172a;text-align:center;flex:1;margin:0 0.5rem;"></span>
                        <button onclick="guideNav(1)" style="background:#f1f5f9;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;">›</button>
                    </div>

                    <div id="guide-dots" style="display:flex;justify-content:center;gap:5px;margin-bottom:1rem;"></div>

                    <div style="margin-bottom:1rem;">
                        <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:#64748b;margin-bottom:4px;">
                            <span>준비 현황</span><span id="guide-prog-label">0 / 0</span>
                        </div>
                        <div style="background:#e2e8f0;border-radius:10px;height:6px;overflow:hidden;">
                            <div id="guide-prog-bar" style="height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:10px;width:0%;transition:width 0.4s;"></div>
                        </div>
                    </div>

                    <div id="guide-checklist" style="display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.2rem;min-height:120px;"></div>

                    <a id="guide-apply-link" href="#" target="_blank" class="btn-doc-link" style="display:block;text-align:center;">신청 페이지 바로가기 ↗</a>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ══════════════════════════════════════
        //  네비게이션 / 로그인 상태
        // ══════════════════════════════════════
        const loggedInUser = localStorage.getItem('userid');
        const navRight = document.getElementById('nav-right');
        if (loggedInUser && navRight) {
            navRight.innerHTML = `
                <span style="color: var(--text-main); margin-left: 2rem;">👤 <b>${loggedInUser}</b>님</span>
                <button id="btn-logout" style="background:none;border:1px solid var(--border);padding:0.3rem 0.7rem;border-radius:6px;font-weight:600;cursor:pointer;margin-left:1rem;color:var(--text-sub);font-size:0.85rem;transition:all 0.2s;">로그아웃</button>`;
            const logoutBtn = document.getElementById('btn-logout');
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('userid');
                alert('로그아웃 되었습니다.');
                window.location.reload();
            });
        } else if (navRight) {
            navRight.innerHTML = `<a href="index.html">로그인</a>`;
        }

        // ══════════════════════════════════════
        //  카테고리 그룹 정의 (원본 17종 → 6그룹)
        // ══════════════════════════════════════
        const CAT_GROUPS = [
            { key: '주거',      emoji: '🏠', color: '#2563eb', bg: '#dbeafe', members: ['주거', '생계/주거'] },
            { key: '금융·자산', emoji: '💰', color: '#15803d', bg: '#dcfce7', members: ['금융', '금융/자산', '현금지원/자기돌봄'] },
            { key: '돌봄',      emoji: '🤝', color: '#6d28d9', bg: '#ede9fe', members: ['돌봄', '돌봄/상담'] },
            { key: '교육·취업', emoji: '📚', color: '#c2410c', bg: '#ffedd5', members: ['교육/역량', '취업/진로'] },
            { key: '건강·심리', emoji: '💚', color: '#0e7490', bg: '#cffafe', members: ['의료/건강', '심리/상담', '건강/스포츠'] },
            { key: '생활·기타', emoji: '🎁', color: '#a16207', bg: '#fef9c3', members: ['생활', '기타지원', '종합지원', '문화/행사', ''] },
        ];

        // 원본 카테고리 → 그룹 key 역매핑
        const CAT_TO_GROUP = {};
        CAT_GROUPS.forEach(g => g.members.forEach(m => { CAT_TO_GROUP[m] = g.key; }));
        function groupOf(cat) { return CAT_TO_GROUP[cat] ?? '생활·기타'; }
        function groupMeta(key) { return CAT_GROUPS.find(g => g.key === key); }

        // ══════════════════════════════════════
        //  상태
        // ══════════════════════════════════════
        let allPolicies = [];
        let activeGroups = new Set();   // 비어있으면 = 전체
        let bookmarks = JSON.parse(localStorage.getItem('bookmarkedPolicies') || '[]');

        // ══════════════════════════════════════
        //  데이터 로드
        // ══════════════════════════════════════
        async function loadPolicies() {
            const res = await fetch('/api/policies');
            allPolicies = await res.json();
            renderWordCloud();
            renderPolicies();
            return allPolicies;
        }

        // ══════════════════════════════════════
        //  워드클라우드 렌더 (그룹별 개수 → 태그 크기)
        // ══════════════════════════════════════
        function renderWordCloud() {
            // 그룹별 정책 수 집계
            const counts = {};
            CAT_GROUPS.forEach(g => counts[g.key] = 0);
            allPolicies.forEach(p => { counts[groupOf(p['카테고리'])]++; });

            const cloud = document.getElementById('wordCloud');

            // 전체 태그
            let html = `<span class="wc-tag ${activeGroups.size === 0 ? 'active' : ''}"
                data-group="__all__"
                style="font-size:0.95rem;${activeGroups.size === 0 ? 'background:#0ea5e9;' : ''}">
                전체 <span class="wc-count">${allPolicies.length}</span></span>`;

            // 그룹 태그 (개수 많을수록 크게)
            CAT_GROUPS.forEach(g => {
                const c = counts[g.key];
                const on = activeGroups.has(g.key);
                html += `<span class="wc-tag ${on ? 'active' : ''}"
                    data-group="${g.key}"
                    style="font-size:0.95rem;${on ? `background:${g.color};` : ''}">
                    ${g.emoji} ${g.key} <span class="wc-count">${c}</span></span>`;
            });

            cloud.innerHTML = html;

            // 클릭 이벤트 (다중 선택 토글)
            cloud.querySelectorAll('.wc-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const g = tag.dataset.group;
                    if (g === '__all__') {
                        activeGroups.clear();
                    } else {
                        activeGroups.has(g) ? activeGroups.delete(g) : activeGroups.add(g);
                    }
                    renderWordCloud();
                    renderPolicies();
                });
            });
        }

        // ══════════════════════════════════════
        //  정책 카드 렌더
        // ══════════════════════════════════════
        function isUrl(s) { return typeof s === 'string' && /^https?:\/\//.test(s); }

        // 사이트 이름 → 실제 URL 매핑 (공백 제거 후 조회)
        const SITE_URL = {
            '서울복지포털': 'https://wis.seoul.go.kr/',
            '서울주거포털': 'https://housing.seoul.go.kr/',
            '서울특별시':   'https://www.seoul.go.kr/',
            '서울특볏시':   'https://www.seoul.go.kr/',   // 오타 대응
            '교육부':       'https://www.moe.go.kr/',
            '복지로':       'https://www.bokjiro.go.kr/',
            '정부24':       'https://www.gov.kr/',
            '에너지바우처': 'https://www.energyv.or.kr/',
        };
        // 참조_링크 → 실제 URL (없으면 null)
        function resolveLink(raw) {
            const s = (raw || '').trim();
            if (!s) return null;
            if (isUrl(s)) return s;
            return SITE_URL[s.replace(/\s/g, '')] || null;
        }

        function ageText(p) {
            const lo = p['최소_연령'], hi = p['최대_연령'];
            if (lo === '-' || lo === undefined || lo === null) return '연령 무관';
            if (hi >= 999) return `만 ${lo}세 이상`;
            return `만 ${lo}~${hi}세`;
        }

        function renderPolicies() {
            const filtered = allPolicies.filter(p =>
                activeGroups.size === 0 || activeGroups.has(groupOf(p['카테고리'])));

            document.getElementById('result-count').innerHTML =
                `총 <b>${filtered.length}</b>건의 정책`;

            const list = document.getElementById('policy-list');
            if (filtered.length === 0) {
                list.innerHTML = '<div class="no-result">😥 선택한 키워드에 맞는 정책이 없습니다.</div>';
                return;
            }

            list.innerHTML = filtered.map(p => {
                const g = groupMeta(groupOf(p['카테고리']));
                const id = p['정책_ID'];
                const isBm = bookmarks.includes(id);
                const benefit = (p['지원_금액(혜택)'] || '').replace(/\s+/g, ' ').trim();
                const url = resolveLink(p['참조_링크']);
                const linkHtml = url
                    ? `<span>🔗 <a href="${url}" target="_blank" style="color:#0ea5e9;text-decoration:underline;">신청/안내 페이지로 바로가기</a></span>`
                    : `<span>🔗 기관 문의</span>`;

                return `
                <div class="policy-item">
                    <div class="policy-top">
                        <span class="policy-tag" style="color:${g.color};background:${g.bg};">${g.emoji} ${p['카테고리']}</span>
                        <span class="d-day-badge" style="color:#16a34a;background:#dcfce7;border-color:#86efac;">${p['신청_기간'] || '상시'}</span>
                        <button onclick="toggleBookmark('${id}', this)" data-id="${id}"
                            style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:1.15rem;line-height:1;padding:0 0.2rem;"
                            title="${isBm ? '찜 취소' : '찜하기'}">${isBm ? '⭐' : '☆'}</button>
                    </div>
                    <h3>${p['정책명']}</h3>
                    <p class="policy-benefit">💰 ${benefit}</p>
                    <div class="policy-meta">
                        <span>👤 ${ageText(p)}</span>
                        <span>📊 ${p['소득_기준'] || '제한 없음'}</span>
                        ${linkHtml}
                    </div>
                </div>`;
            }).join('');
        }

        // ══════════════════════════════════════
        //  찜하기
        // ══════════════════════════════════════
        function toggleBookmark(id, btn) {
            const idx = bookmarks.indexOf(id);
            if (idx === -1) {
                bookmarks.push(id);
                btn.textContent = '⭐'; btn.title = '찜 취소';
            } else {
                bookmarks.splice(idx, 1);
                btn.textContent = '☆'; btn.title = '찜하기';
            }
            localStorage.setItem('bookmarkedPolicies', JSON.stringify(bookmarks));
            buildGuideData();
        }

        // ══════════════════════════════════════
        //  서류 준비 가이드 (찜한 정책 기반)
        // ══════════════════════════════════════
        let GUIDE_DATA = [];
        let guideIdx = 0;

        function hasDocs(docStr) {
            const d = (docStr || '').trim();
            return d && d !== '-' && d !== '없음';
        }

        function buildGuideData() {
            GUIDE_DATA = allPolicies
                .filter(p => bookmarks.includes(p['정책_ID']))
                .map(p => {
                    const g = groupMeta(groupOf(p['카테고리']));
                    return {
                        title: `${g.emoji} ${p['정책명']}`,
                        policyId: p['정책_ID'],
                        applyUrl: resolveLink(p['참조_링크']) || '#',
                        docs: hasDocs(p['제출_서류'])
                            ? p['제출_서류'].split(',').map(d => d.trim()).filter(Boolean)
                            : [],
                    };
                });
            guideIdx = 0;
            renderGuide();
        }

        function renderGuide() {
            const $ = id => document.getElementById(id);
            if (GUIDE_DATA.length === 0) {
                $('guide-title').textContent = '';
                $('guide-dots').innerHTML = '';
                $('guide-prog-label').textContent = '';
                $('guide-prog-bar').style.width = '0%';
                $('guide-apply-link').style.display = 'none';
                $('guide-checklist').innerHTML =
                    '<p style="color:#94a3b8;font-size:0.85rem;text-align:center;padding:1rem 0;">⭐ 정책을 찜하면<br>서류 준비 가이드가 표시됩니다.</p>';
                return;
            }

            $('guide-apply-link').style.display = 'block';
            const g = GUIDE_DATA[guideIdx];
            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');

            $('guide-title').textContent = g.title;
            $('guide-apply-link').href = g.applyUrl;
            if (g.applyUrl === '#') $('guide-apply-link').removeAttribute('href');

            $('guide-dots').innerHTML = GUIDE_DATA.map((_, i) =>
                `<span style="width:7px;height:7px;border-radius:50%;background:${i === guideIdx ? '#0ea5e9' : '#e2e8f0'};display:inline-block;"></span>`
            ).join('');

            // 제출 서류 정보가 없는 정책 처리
            if (g.docs.length === 0) {
                $('guide-prog-label').textContent = '-';
                $('guide-prog-bar').style.width = '0%';
                $('guide-checklist').innerHTML =
                    '<p style="color:#94a3b8;font-size:0.85rem;text-align:center;padding:1rem 0;line-height:1.6;">이 정책은 제출 서류 정보가<br>따로 안내되어 있지 않아요.<br>신청 페이지에서 확인해 주세요.</p>';
                return;
            }

            $('guide-checklist').innerHTML = g.docs.map((doc, i) => {
                const checked = !!docChecks[`${g.policyId}-${i}`];
                return `
                <div style="display:flex;align-items:flex-start;gap:0.6rem;">
                    <input type="checkbox" id="sg-${g.policyId}-${i}" data-docname="${doc}"
                        ${checked ? 'checked' : ''}
                        onchange="guideCheck('${g.policyId}', ${i}, this)"
                        style="width:15px;height:15px;accent-color:#0ea5e9;flex-shrink:0;margin-top:2px;cursor:pointer;">
                    <label for="sg-${g.policyId}-${i}" style="font-size:0.9rem;font-weight:600;color:${checked ? '#94a3b8' : '#1e293b'};cursor:pointer;${checked ? 'text-decoration:line-through;' : ''}">${doc}</label>
                </div>`;
            }).join('');

            updateGuideProgress(g);
        }

        function updateGuideProgress(g) {
            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');
            const done = g.docs.filter((_, i) => docChecks[`${g.policyId}-${i}`]).length;
            const pct = g.docs.length ? Math.round((done / g.docs.length) * 100) : 0;
            document.getElementById('guide-prog-label').textContent = `${done} / ${g.docs.length}`;
            document.getElementById('guide-prog-bar').style.width = pct + '%';
        }

        function guideNav(dir) {
            if (GUIDE_DATA.length === 0) return;
            guideIdx = (guideIdx + dir + GUIDE_DATA.length) % GUIDE_DATA.length;
            renderGuide();
        }

        function guideCheck(policyId, docIdx, cb) {
            const docChecks = JSON.parse(localStorage.getItem('docChecks') || '{}');
            docChecks[`${policyId}-${docIdx}`] = cb.checked;

            // 같은 서류명 자동 동기화
            const docName = cb.dataset.docname;
            GUIDE_DATA.forEach(g => {
                g.docs.forEach((doc, i) => {
                    if (doc === docName && !(g.policyId === policyId && i === docIdx)) {
                        docChecks[`${g.policyId}-${i}`] = cb.checked;
                    }
                });
            });

            localStorage.setItem('docChecks', JSON.stringify(docChecks));
            const label = document.querySelector(`label[for="sg-${policyId}-${docIdx}"]`);
            if (label) {
                label.style.textDecoration = cb.checked ? 'line-through' : '';
                label.style.color = cb.checked ? '#94a3b8' : '#1e293b';
            }
            updateGuideProgress(GUIDE_DATA[guideIdx]);
        }

        // ══════════════════════════════════════
        //  초기 로드
        // ══════════════════════════════════════
        window.addEventListener('load', () => {
            loadPolicies().then(() => buildGuideData());
        });
    </script>
</body>
</html>
