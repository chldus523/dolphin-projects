<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 청년정책 돌고래</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <div class="brand-section">
            <div class="circle-deco" style="width: 200px; height: 200px; top: -50px; left: -50px;"></div>
            <div class="circle-deco" style="width: 100px; height: 100px; bottom: 50px; right: 50px;"></div>

            <div class="brand-logo">
                <span class="brand-icon-big">🐬</span>
                <span>돌고래</span>
            </div>

            <h1 class="brand-slogan">나에게 꼭 맞는<br>청년정책을 자유롭게</h1>
            <p class="brand-desc">흩어져 있는 수백 개의 청년 지원 정책들,<br>돌고래가 당신의 조건에 맞춰 가장 빠르고 정확하게 찾아드립니다.</p>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h2>회원가입</h2>
                <p>돌고래 플랫폼 계정을 만들어보세요.</p>
            </div>

            <form id="register-form">
                <div class="input-group">
                    <label>아이디</label>
                    <input type="text" id="userid" placeholder="4자 이상 입력해주세요" required>
                </div>
                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" placeholder="6자 이상 입력해주세요" required>
                </div>
                <div class="input-group">
                    <label>비밀번호 확인</label>
                    <input type="password" id="password-confirm" placeholder="비밀번호를 다시 입력해주세요" required>
                </div>

                <p id="error-msg" style="color:#ef4444;font-size:0.83rem;margin-bottom:0.8rem;display:none;"></p>

                <button type="submit" class="btn-login">회원가입</button>
            </form>

            <div class="login-links">
                <a href="index.html" style="font-weight: 700; color: var(--primary);">이미 계정이 있으신가요? 로그인</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userid = document.getElementById('userid').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('password-confirm').value;
            const errorMsg = document.getElementById('error-msg');

            if (password !== confirm) {
                errorMsg.textContent = '비밀번호가 일치하지 않습니다.';
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userid, password })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('userid', userid);
                    window.location.href = 'onboarding.html';
                } else {
                    errorMsg.textContent = result.message;
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = '서버와 연결할 수 없습니다. 서버가 켜져 있는지 확인해주세요.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
  <script src="script.js"></script>
</body>

</html>
