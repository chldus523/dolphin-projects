<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 청년정책 돌고래</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <div class="brand-section">
            <div class="circle-deco" style="width: 200px; height: 200px; top: -50px; left: -50px;"></div>
            <div class="circle-deco" style="width: 100px; height: 100px; bottom: 50px; right: 50px;"></div>

            <div class="brand-logo">
                <span class="brand-icon-big">🐬</span>
                <span>돌고래</span>
            </div>

            <h1 class="brand-slogan">나에게 꼭 맞는<br>청년정책을 자유롭게</h1>
            <p class="brand-desc">흩어져 있는 수백 개의 청년 지원 정책들,<br>돌고래가 당신의 조건에 맞춰 가장 빠르고 정확하게 찾아드립니다.</p>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h2>반갑습니다!</h2>
                <p>돌고래 플랫폼 계정으로 로그인하세요.</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label>아이디</label>
                    <input type="text" id="userid" placeholder="입력해주세요" required>
                </div>
                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" placeholder="입력해주세요" required>
                </div>

                <button type="submit" class="btn-login">로그인</button>
            </form>

            <div class="login-links" style="justify-content: center;">
                <span style="color: var(--text-sub);">아직 계정이 없으신가요?</span>
                <a href="register.html" style="font-weight: 700; color: var(--primary);">회원가입</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userid = document.getElementById('userid').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // [중요] 서버의 express-session 쿠키를 전달받기 위해 credentials 추가
                    credentials: 'include',
                    body: JSON.stringify({ userid, password })
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    // [보안 수정] localStorage.setItem('userid', userid); 제거!
                    // 이제 서버가 세션 쿠키를 보관하므로 브라우저 localstorage에 id를 남기지 않습니다.
                    window.location.href = 'home.html';
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('서버와 연결할 수 없습니다. 서버가 켜져 있는지 확인해주세요!');
            }
        });
    </script>
</body>

</html>
